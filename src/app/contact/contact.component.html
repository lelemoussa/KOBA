<section id="contact" class="contact">
  <div class="container">
    <h2 class="section-title">Contactez-nous</h2>
    
    <div class="contact-content">
      <div class="contact-info">
        <h3>Coordonnées</h3>
        
        <div class="info-item">
          <span class="icon">📞</span>
          <div>
            <strong>Téléphones</strong>
            <p>
              <a href="tel:0747334094">07 47 33 40 94</a> / 
              <a href="tel:0140209303">01 40 20 93 03</a>
            </p>
          </div>
        </div>

        <div class="info-item">
          <span class="icon">✉️</span>
          <div>
            <strong>Email</strong>
            <p><a href="mailto:kobaentreprise58&#64;gmail.com">kobaentreprise58&#64;gmail.com</a></p>
          </div>
        </div>

        <div class="info-item">
          <span class="icon">📍</span>
          <div>
            <strong>Adresse</strong>
            <p>Marcory (Anoumabo)<br>Carrefour milieu</p>
          </div>
        </div>

        <div class="emergency-contact">
          <h4>🚨 Contact d'urgence</h4>
          <p>Disponible 24h/24 pour vos urgences</p>
          <a href="tel:0747334094" class="btn btn-primary">Appeler maintenant</a>
        </div>
      </div>

      <div class="contact-form">
        <h3>Demande de devis gratuit</h3>
        
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-group">
            <input 
              type="text" 
              [(ngModel)]="formData.name" 
              name="name"
              placeholder="Votre nom *" 
              required>
          </div>

          <div class="form-group">
            <input 
              type="email" 
              [(ngModel)]="formData.email" 
              name="email"
              placeholder="Votre email *" 
              required>
          </div>

          <div class="form-group">
            <input 
              type="tel" 
              [(ngModel)]="formData.phone" 
              name="phone"
              placeholder="Votre téléphone *" 
              required>
          </div>

          <div class="form-group">
            <select [(ngModel)]="formData.service" name="service" required>
              <option value="">Choisir un service *</option>
              <option *ngFor="let service of services" [value]="service">{{ service }}</option>
            </select>
          </div>

          <div class="form-group">
            <textarea 
              [(ngModel)]="formData.message" 
              name="message"
              placeholder="Décrivez votre projet..."
              rows="5"></textarea>
          </div>

          <button 
            type="submit" 
            class="btn btn-primary"
            [disabled]="!contactForm.form.valid">
            Envoyer ma demande
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
