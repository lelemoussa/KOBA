<div class="realisation-card">
    <h2>{{ myRealisation.title }}</h2>

    <img [src]="myRealisation.imageUrl" [alt]="myRealisation.title">

    <p class="description">{{ myRealisation.description }}</p>

    <p class="date">Ajouté le {{ myRealisation.createdAt | date: 'dd/MM/yyyy' }}</p>

    <div class="actions">
        <button (click)="onLike()" class="like-btn">{{ likeButtonText }}</button>
        <span class="likes-count">👍 {{ myRealisation.likes }}</span>
    </div>
</div>
